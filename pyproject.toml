[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "integration: requires the bundled PostgreSQL cluster (pgserver)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.pytest-asyncio]
loop_scope = "session"
